name: CI

# El despliegue lo hace Netlify (netlify.toml) al publicar en main. Aquí solo
# comprobamos que el proyecto compila y que los tests pasan.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
